name: Build Pelican plugin ZIP (preview)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          tools: none
          coverage: none
      - name: Create installable preview ZIP
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(php -r '$p=json_decode(file_get_contents("plugin.json"),true,512,JSON_THROW_ON_ERROR); echo $p["version"];')"
          bash scripts/build-release.sh "$BASE" "v$BASE" "$GITHUB_REPOSITORY"
          unzip -tq dist/modpack-manager.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Upload preview install ZIP
        uses: actions/upload-artifact@v4
        with:
          name: pelican-modpack-manager-preview
          path: dist/modpack-manager.zip
          if-no-files-found: error
          retention-days: 14
