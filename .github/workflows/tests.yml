name: Validate Arcturus plugin
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Install POSIX ACL test tools
        run: sudo apt-get update && sudo apt-get install -y acl
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring
          coverage: none
          tools: none
      - run: bash scripts/test.sh
  pelican:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        panel: ['v1.0.0-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, intl, pdo_sqlite, mbstring, bcmath, sodium, curl
          tools: composer
          coverage: none
      - name: Install disposable official Pelican dependencies
        env:
          PANEL_REF: ${{ matrix.panel }}
        run: |
          git clone --depth=1 --branch "$PANEL_REF" https://github.com/pelican-dev/panel.git /tmp/arcturus-panel
          composer install --working-dir=/tmp/arcturus-panel --no-dev --no-scripts --no-interaction --prefer-dist
      - name: Exercise native framework contracts and migrations
        env:
          PELICAN_SOURCE: /tmp/arcturus-panel
        run: |
          php tests/integration/pelican.php
          php tests/integration/console.php
          node tests/console_output.mjs
          git -C "$PELICAN_SOURCE" apply --check "$GITHUB_WORKSPACE/patches/pelican/rc2-console-append.patch"
          php tests/integration/filament.php
          php tests/integration/livewire.php
          php tests/integration/adoption.php
          php tests/integration/local.php
          php tests/integration/local_node.php
          php tests/integration/curseforge.php
          php tests/integration/runtime.php
          php tests/integration/native_download.php
          php tests/integration/native_connections.php
          php tests/integration/native_wings.php
          php tests/integration/native_receipt.php
          php tests/integration/native_inventory.php
          php tests/integration/native_batch.php
          php tests/integration/native_bulk.php
          php tests/integration/apply_batches.php
          php tests/integration/manual_lease.php
          php tests/integration/native_deployment.php
          php tests/integration/boot_race.php
          php tests/integration/policies.php
          php tests/integration/kubejs.php
          php -d memory_limit=128M tests/integration/memory.php
          php tests/integration/discord.php
          php tests/integration/discord_deployment.php
          php tests/integration/deployment.php
      - name: Render updater and native game output in the same xterm
        run: |
          npm install --prefix /tmp/arcturus-console-browser --ignore-scripts --no-audit --no-fund playwright@1.58.2 @xterm/xterm@6.0.0
          /tmp/arcturus-console-browser/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/arcturus-console-browser/node_modules/playwright/index.mjs \
          XTERM_SCRIPT=/tmp/arcturus-console-browser/node_modules/@xterm/xterm/lib/xterm.js \
          PELICAN_SOURCE=/tmp/arcturus-panel node tests/console_browser.mjs
  package:
    # Build the downloadable preview even if a validation job fails; release.yml still requires all checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: none
          coverage: none
      - name: Validate installable package and update feed
        run: |
          VERSION=$(php -r 'echo json_decode(file_get_contents("plugin.json"),true,512,JSON_THROW_ON_ERROR)["version"];')
          bash scripts/build-release.sh "$VERSION" "v$VERSION" "$GITHUB_REPOSITORY"
          unzip -tq dist/arcturus-modpack-manager.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: arcturus-modpack-manager-preview
          path: |
            dist/arcturus-modpack-manager.zip
            dist/update.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
