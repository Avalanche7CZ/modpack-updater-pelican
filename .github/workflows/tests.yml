name: Validate Arcturus plugin
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Install POSIX ACL test tools
        run: sudo apt-get update && sudo apt-get install -y acl
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring
          coverage: none
          tools: none
      - run: bash scripts/test.sh
  pelican:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        panel: ['v1.0.0-rc.1', 'v1.0.0-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, intl, pdo_sqlite, mbstring, bcmath, sodium, curl
          tools: composer
          coverage: none
      - name: Install disposable official Pelican dependencies
        env:
          PANEL_REF: ${{ matrix.panel }}
        run: |
          git clone --depth=1 --branch "$PANEL_REF" https://github.com/pelican-dev/panel.git /tmp/arcturus-panel
          composer install --working-dir=/tmp/arcturus-panel --no-dev --no-scripts --no-interaction --prefer-dist
      - name: Exercise native framework contracts and migrations
        env:
          PELICAN_SOURCE: /tmp/arcturus-panel
        run: |
          php tests/integration/pelican.php
          php tests/integration/filament.php
          php tests/integration/livewire.php
          php tests/integration/adoption.php
          php tests/integration/local.php
          php tests/integration/local_node.php
          php tests/integration/curseforge.php
          php tests/integration/runtime.php
          php tests/integration/policies.php
          php tests/integration/kubejs.php
          php -d memory_limit=128M tests/integration/memory.php
          php tests/integration/discord.php
          php tests/integration/discord_deployment.php
          php tests/integration/deployment.php
  package:
    needs: [regression, pelican]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: none
          coverage: none
      - name: Validate installable package and update feed
        run: |
          VERSION=$(php -r 'echo json_decode(file_get_contents("plugin.json"),true,512,JSON_THROW_ON_ERROR)["version"];')
          bash scripts/build-release.sh "$VERSION" "v$VERSION" "$GITHUB_REPOSITORY"
          unzip -tq dist/arcturus-modpack-manager.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: arcturus-modpack-manager-preview
          path: |
            dist/arcturus-modpack-manager.zip
            dist/update.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
