name: Planner tests

on:
  push:
  pull_request:

jobs:
  php-planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Check syntax
        run: |
          find src bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test read-only engine
        run: |
          php tests/planner.php
          php tests/inventory.php
          php tests/deployment.php
          php tests/backup_safety.php
          php tests/backup_exclusions.php
          php tests/preserved_folders.php
      - name: CLI smoke test
        run: |
          set -eu
          TEMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TEMP_DIR"' EXIT
          mkdir -p "$TEMP_DIR/base/mods" "$TEMP_DIR/target/mods" "$TEMP_DIR/live/mods"
          printf old > "$TEMP_DIR/base/mods/A.jar"
          printf new > "$TEMP_DIR/target/mods/A.jar"
          printf old > "$TEMP_DIR/live/mods/A.jar"
          php bin/modpack.php manifest "$TEMP_DIR/base" 1.0 > "$TEMP_DIR/base.json"
          php bin/modpack.php manifest "$TEMP_DIR/target" 2.0 > "$TEMP_DIR/target.json"
          php bin/modpack.php preview "$TEMP_DIR/base.json" "$TEMP_DIR/target.json" "$TEMP_DIR/live" > "$TEMP_DIR/preview.json"
          php -r '$p=json_decode(file_get_contents($argv[1]),true); if (($p["counts"]["update"] ?? 0) !== 1 || $p["blocked"] !== 0) exit(1);' "$TEMP_DIR/preview.json"
