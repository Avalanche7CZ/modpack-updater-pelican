name: Auto Release — Pelican plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Serial publishing prevents competing release/tag writes.
concurrency:
  group: pelican-plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: none
      - name: Compute next unique semantic version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="$(php -r '$p=json_decode(file_get_contents("plugin.json"),true,512,JSON_THROW_ON_ERROR); echo $p["version"];')"
          if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "plugin.json version must be numeric MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          MAJOR="$(echo "$BASE" | cut -d. -f1)"
          MINOR="$(echo "$BASE" | cut -d. -f2)"
          PATCH="$(echo "$BASE" | cut -d. -f3)"
          VERSION="$MAJOR.$MINOR.$((10#$PATCH + GITHUB_RUN_NUMBER))"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [[ -n "$LATEST" && "$LATEST" != "$TAG" ]]; then
            php -r '
              if (version_compare(ltrim($argv[1], "v"), ltrim($argv[2], "v"), "<=")) {
                  fwrite(STDERR, "Computed release is not newer than the latest published release\n"); exit(1);
              }
            ' "$TAG" "$LATEST"
          fi
      - name: Assemble and validate installable ZIP and update feed
        shell: bash
        run: |
          bash scripts/build-release.sh "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.tag }}" "$GITHUB_REPOSITORY"
          unzip -tq dist/arcturus-modpack-manager.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish GitHub Release with Pelican ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists (rerun); skipping duplicate publication."
            exit 0
          fi
          gh release create "$TAG" \
            dist/arcturus-modpack-manager.zip \
            dist/update.json \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Pelican Arcturus Modpack Manager ${{ steps.version.outputs.version }}" \
            --notes "Automatically published from main commit $GITHUB_SHA.

          Install: download arcturus-modpack-manager.zip and import in Pelican Admin → Plugins.
          Update feed: update.json is consumed by Pelican's built-in plugin updater.
          Safety: read docs/capabilities.md. Remote destructive deployment remains disabled pending integration qualification."
